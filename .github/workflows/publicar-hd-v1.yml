name: Publicar patch HD na release v1.0
on:
  push:
    branches:
      - main
    paths:
      - 'MHP3rd_HD_Ver_PT-BR_v1.0_base_v6.1.0.xdelta'
permissions:
  contents: write
concurrency:
  group: publicar-mhp3rd-hd-v1-0
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verificar e publicar o patch HD na release existente
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PATCH_NAME: MHP3rd_HD_Ver_PT-BR_v1.0_base_v6.1.0.xdelta
          PATCH_BLOB: 44f83777c8bef695988c7796cc37b0734a2525cd
          PATCH_SHA256: cb9c6b4a08907e527126bf5577febcf36f4d00a283c472091a41a9efb21652cd
          RELEASE_NOTES: |
            Primeira versão pública da tradução de **Monster Hunter Portable 3rd** para português do Brasil, com patches para PSP e HD ver.
            
            - **PSP — Base em inglês v6.1.0 (Team Maverick One)** — `MHP3rd_PT-BR_v1.0_base_v6.1.0.xdelta`
            - **PSP — Base em inglês v6.2.2 (Team Maverick One)** — `MHP3rd_PT-BR_v1.0_base_v6.2.2.xdelta`
            - **HD ver. — Base em inglês v6.1.0 (Team Maverick One)** — `MHP3rd_HD_Ver_PT-BR_v1.0_base_v6.1.0.xdelta`
            
            Aplique apenas o patch correspondente à sua ISO base. Os dois patches PSP geram a mesma ISO traduzida v1.0. O patch HD ver. gera a ISO traduzida correspondente à edição HD, com os textos portados e os gráficos da base em inglês.
            
            [Instruções de instalação](https://github.com/rafsiq/monster-hunter-portable-3rd-ptbr#como-instalar) · [Checksums SHA-256](https://github.com/rafsiq/monster-hunter-portable-3rd-ptbr/blob/main/CHECKSUMS.md) · [Vídeo da tradução](https://www.youtube.com/watch?v=Uh9X6GgBxfI)
        shell: bash
        run: |
          set -euo pipefail
          gh release view v1.0 --repo "$GH_REPO" > /dev/null
          patch_path="$RUNNER_TEMP/$PATCH_NAME"
          gh api "repos/$GH_REPO/git/blobs/$PATCH_BLOB" --jq .content | base64 --decode > "$patch_path"
          printf '%s  %s\n' "$PATCH_SHA256" "$patch_path" | sha256sum --check --status
          existing_digest=$(gh api "repos/$GH_REPO/releases/tags/v1.0" --jq '.assets[] | select(.name == "MHP3rd_HD_Ver_PT-BR_v1.0_base_v6.1.0.xdelta") | .digest')
          if [ -z "$existing_digest" ]; then
            gh release upload v1.0 "$patch_path" --repo "$GH_REPO"
          elif [ "$existing_digest" != "sha256:$PATCH_SHA256" ]; then
            echo "A release já contém um arquivo HD com hash diferente." >&2
            exit 1
          fi
          printf '%s\n' "$RELEASE_NOTES" > "$RUNNER_TEMP/mhp3rd-release-notes.md"
          gh release edit v1.0 --repo "$GH_REPO" --notes-file "$RUNNER_TEMP/mhp3rd-release-notes.md"
