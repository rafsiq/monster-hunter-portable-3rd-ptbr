name: Publicar release v1.1
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publicar-v1-1.yml'
      - 'MHP3rd_HD_Ver_PT-BR_v1.1_base_v6.1.0.xdelta'
      - 'MHP3rd_PT-BR_v1.1_base_v6.1.0.xdelta'
      - 'MHP3rd_PT-BR_v1.1_base_v6.2.2.xdelta'
permissions:
  contents: write
concurrency:
  group: publicar-mhp3rd-v1-1
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publicar os três Xdelta v1.1
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_NOTES: 'Correção de bug onde o jogo poderia crashar e exibir um texto incorreto ao renomear um conjunto de equipamentos.'
          PATCHES: '[{"name":"MHP3rd_HD_Ver_PT-BR_v1.1_base_v6.1.0.xdelta","blob":"3f061d2aa38bf20001db2009f232e61e2c21579e","sha256":"2b2dc812b541fc8d1256ebd1e97052eff7a9513feb83c7ffe2216d08547a6166","size":1356987},{"name":"MHP3rd_PT-BR_v1.1_base_v6.1.0.xdelta","blob":"89d101c88cbb673fad4b87372c1462eceefd6fc2","sha256":"52b8af4d286dd67b173ea3261ee6df8e0022a6a30b9b4e9b757f5b1d480bda5d","size":2209765},{"name":"MHP3rd_PT-BR_v1.1_base_v6.2.2.xdelta","blob":"fb3397edb8bc0779ea4a8f1787440888fd2730dd","sha256":"9b2be500f500b38dc011208e821c5a70f6b0e240bd9870b5974fc3f3974d899b","size":2190647}]'
        shell: bash
        run: |
          set -euo pipefail
          release_id=460130647
          tag_name=$(gh api "repos/$GH_REPO/releases/$release_id" --jq .tag_name)
          test "$tag_name" = "v1.1"
          for index in 0 1 2; do
            patch_name=$(printf '%s' "$PATCHES" | jq -r ".[$index].name")
            patch_blob=$(printf '%s' "$PATCHES" | jq -r ".[$index].blob")
            patch_sha=$(printf '%s' "$PATCHES" | jq -r ".[$index].sha256")
            patch_path="$RUNNER_TEMP/$patch_name"
            gh api "repos/$GH_REPO/git/blobs/$patch_blob" --jq .content | base64 --decode > "$patch_path"
            printf '%s  %s\n' "$patch_sha" "$patch_path" | sha256sum --check --status
            existing_digest=$(gh api "repos/$GH_REPO/releases/$release_id" --jq ".assets[] | select(.name == \"$patch_name\") | .digest")
            if [ -z "$existing_digest" ]; then
              gh api --method POST "https://uploads.github.com/repos/$GH_REPO/releases/$release_id/assets?name=$patch_name" --header "Content-Type: application/octet-stream" --input "$patch_path" --silent
            elif [ "$existing_digest" != "sha256:$patch_sha" ]; then
              echo "A release já contém um arquivo com hash diferente." >&2
              exit 1
            fi
          done
          gh api --method PATCH "repos/$GH_REPO/releases/$release_id" -f body="$RELEASE_NOTES" -f tag_name=v1.1 -f target_commitish="$GITHUB_SHA" -F draft=false -f make_latest=true --silent
